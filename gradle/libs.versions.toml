[versions]
junit4 = "4.13.2"
junit5 = "5.14.4"
# Client (uiTest) and robot-server plugin must be the same version.
remoteRobot = "0.11.23"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
remote-robot = { module = "com.intellij.remoterobot:remote-robot", version.ref = "remoteRobot" }
remote-fixtures = { module = "com.intellij.remoterobot:remote-fixtures", version.ref = "remoteRobot" }
