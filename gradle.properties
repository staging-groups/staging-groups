# --- Plugin identity -------------------------------------------------------
# pluginGroup is the root package. The <id> in plugin.xml must never change after the first
# Marketplace upload: the listing and every installed copy's updates are keyed to it.
pluginGroup = dev.yendrrek.staginggroups
pluginName = Staging Groups
pluginVersion = 0.1.0-SNAPSHOT

# --- Compatibility ---------------------------------------------------------
# Compile baseline and oldest supported IDE: 261 is IntelliJ IDEA 2026.1, which bundles Kotlin 2.3
# and targets JDK 21. Raising either drops users on older IDEs and is a major version bump.
platformVersion = 2026.1.5
pluginSinceBuild = 261

# --- Build behaviour -------------------------------------------------------
# The platform bundles the Kotlin stdlib; bundling a second copy causes conflicts.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
